<circle cx="210" cy="350" r="7" fill="#e0a800"/>
<text x="198" y="355" text-anchor="end" font-size="14" font-weight="700">D21 (GPIO21)</text>
<circle cx="210" cy="400" r="7" fill="#2a9d3f"/>
<text x="198" y="405" text-anchor="end" font-size="14" font-weight="700">D22 (GPIO22)</text>
