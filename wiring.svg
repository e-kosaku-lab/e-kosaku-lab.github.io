<text x="480" y="528" text-anchor="middle" font-size="14" font-weight="700">VCC</text>
<text x="540" y="528" text-anchor="middle" font-size="14" font-weight="700">GND</text>
<text x="600" y="528" text-anchor="middle" font-size="14" font-weight="700">SDA</text>
<text x="660" y="528" text-anchor="middle" font-size="14" font-weight="700">SCL</text>
<text x="716" y="247" font-size="15" font-weight="700" fill="#d62828">電気（＋）</text>
<text x="716" y="266" font-size="12" fill="#444">3V3（3.3V）／ VCC</text>
<text x="716" y="297" font-size="15" font-weight="700" fill="#222222">電気（−）</text>
<text x="716" y="316" font-size="12" fill="#444">GND ／ GND</text>
<text x="716" y="347" font-size="15" font-weight="700" fill="#e0a800">データ</text>
<text x="716" y="366" font-size="12" fill="#444">D21 ／ SDA</text>
<text x="716" y="397" font-size="15" font-weight="700" fill="#2a9d3f">時計</text>
<text x="716" y="416" font-size="12" fill="#444">D22 ／ SCL</text>
<rect x="40" y="486" width="380" height="150" rx="8" fill="#fff4f4" stroke="#d62828" stroke-width="2"/>
<text x="54" y="510" font-size="14" font-weight="700" fill="#d62828">⚠ 気をつけること</text>
<text x="54" y="532" font-size="13">・電気（＋）は必ず「3V3」（3.3ボルト）へ。</text>
<text x="54" y="550" font-size="13">　「5V」「VIN」には、つながない。</text>
<text x="54" y="572" font-size="13">・部品の端子のならび順は商品でちがいます。</text>
<text x="54" y="590" font-size="13">　基板に書いてある名前を見てつなぎます。</text>
<text x="54" y="612" font-size="13">・ESP32のピンは左右に分かれています。ボード</text>
<text x="54" y="630" font-size="13">　に書いてある名前（3V3,GND,D21,D22）をさがす。</text>
<text x="450" y="660" text-anchor="middle" font-size="11" fill="#777">※ブレッドボードの穴の位置ではなく、つなぎかたを示した図です。</text>
