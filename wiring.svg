<text x="125" y="196" text-anchor="middle" font-size="17" font-weight="700">ESP32 ボード</text>
<text x="125" y="216" text-anchor="middle" font-size="12" fill="#555">（NodeMCU-32S）</text>
<circle cx="210" cy="250" r="7" fill="#d62828"/>
<text x="198" y="255" text-anchor="end" font-size="14" font-weight="700">3V3</text>
<circle cx="210" cy="300" r="7" fill="#222222"/>
